<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cottovunque</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1 class="title">cottovunque</h1>

    <p class="manifesto">
      un archivio libero, fatto dalla comunità e in costante espansione.<br>
      In nome della tradizione del cotto, della democrazia, delle contraddizioni.
    </p>

    <p class="cta">
      cosa aspetti a partecipare? carica la tua foto
    </p>

    <div class="upload-section">

      <input type="file" id="upload" multiple accept="image/*">

      <canvas id="canvas"></canvas>

      <button id="postBtn">pubblica nell’archivio</button>

    </div>

    <div id="gallery" class="gallery"></div>

  </main>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>
</html>
